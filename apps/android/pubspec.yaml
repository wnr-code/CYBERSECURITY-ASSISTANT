name: cybersecurity_assistant
description: Local-first Android cybersecurity assistant foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.4.0
  flutter_secure_storage: ^11.2.0
  package_info_plus: ^8.3.0
  material_ui: ^1.11.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/market/
