name: Flutter quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Flutter and Dart toolchain
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install pinned Android SDK, NDK, and CMake
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Generate Android Gradle scaffold
        working-directory: apps/android
        run: flutter create --no-pub --platforms=android --project-name cybersecurity_assistant --org org.cybersecurityassistant .

      - name: Apply and test Android hardening configuration
        working-directory: apps/android
        run: |
          python3 -m unittest discover -s tool -p 'test_*.py' -v
          python3 tool/configure_android.py

      - name: Record Flutter, Java, Android SDK, NDK, CMake, and Gradle versions
        working-directory: apps/android
        run: |
          mkdir -p build
          {
            echo 'Flutter:'; flutter --version
            echo 'Dart:'; dart --version 2>&1
            echo 'Java:'; java -version 2>&1
            echo 'Android SDK packages:'; sdkmanager --list_installed 2>&1
            sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo 'NDK:'; cat "$sdk_root/ndk/27.0.12077973/source.properties"
            echo 'CMake:'; "$sdk_root/cmake/3.22.1/bin/cmake" --version
            echo 'Gradle wrapper:'; ./android/gradlew --version
          } | tee build/local-ai-toolchain.txt

      - name: Resolve Flutter dependencies
        working-directory: apps/android
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          result = subprocess.run(["flutter", "pub", "get"], capture_output=True, text=True)
          output = result.stdout + result.stderr
          print(output, end="" if output.endswith("\n") else "\n")
          if result.returncode:
              detail = output[-3000:]
              escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Flutter pub get::{escaped}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("### Flutter dependency resolution failure\n\n```text\n")
                  summary.write(output[-12000:])
                  summary.write("\n```\n")
          sys.exit(result.returncode)
          PY

      - name: Analyze Flutter source
        id: flutter_analyze
        working-directory: apps/android
        run: python3 tool/run_flutter_analyze.py

      - name: Run unit and widget tests
        id: flutter_tests
        working-directory: apps/android
        env:
          FLUTTER_TEST_EVIDENCE_DIR: ${{ runner.temp }}/flutter-test-evidence
        run: python3 tool/run_flutter_test.py

      - name: Upload Flutter test evidence
        if: always() && steps.flutter_tests.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flutter-test-evidence/
          if-no-files-found: error
          retention-days: 3

      - name: Build Android debug APK
        working-directory: apps/android
        run: python3 tool/run_flutter_build.py

      - name: Report debug APK size
        working-directory: apps/android
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          bytes=$(stat -c '%s' "$apk")
          mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          echo "Debug APK: ${bytes} bytes (${mib} MiB)"
          echo "::notice title=Debug APK size::${bytes} bytes (${mib} MiB)"
          echo "### Android debug APK size" >> "$GITHUB_STEP_SUMMARY"
          echo "${bytes} bytes (${mib} MiB)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify native splash in built APK
        working-directory: apps/android
        run: python3 tool/verify_android_splash.py --apk build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cybersecurity-assistant-android-verification
          path: |
            apps/android/build/app/outputs/flutter-apk/app-debug.apk
            apps/android/pubspec.lock
          if-no-files-found: error
          retention-days: 7

      - name: Cold start on Android 12+ emulator (API 35)
        id: cold_api35
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          disable-animations: false
          working-directory: apps/android
          script: python3 tool/capture_android_cold_start.py --apk build/app/outputs/flutter-apk/app-debug.apk --output-dir build/cold-start/api-35 --api-level 35

      - name: Cold start on legacy Android emulator (API 30)
        id: cold_api30
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          disable-animations: false
          working-directory: apps/android
          script: python3 tool/capture_android_cold_start.py --apk build/app/outputs/flutter-apk/app-debug.apk --output-dir build/cold-start/api-30 --api-level 30

      - name: Upload cold-start screenshots, timing, and logcat
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-cold-start-captures
          path: apps/android/build/cold-start
          if-no-files-found: warn
          retention-days: 14

      - name: Build and audit source-native CPU-only ARM64 APK
        id: source_native_build
        if: always() && github.event_name == 'workflow_dispatch' && steps.flutter_analyze.outcome == 'success'
        working-directory: apps/android
        env:
          LOCAL_AI_NATIVE_BUILD: '1'
        run: python3 tool/run_flutter_build.py

      - name: Upload source-native failure diagnostics
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-ai-native-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/android/build/local-ai-native-diagnostics.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize source-native audit result
        if: always() && github.event_name == 'workflow_dispatch' && steps.source_native_build.outcome == 'success' && hashFiles('apps/android/build/local-ai-audit-report.json') != ''
        working-directory: apps/android
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "### Local AI native APK validation (not device readiness)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow run: ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${COMMIT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- llama.cpp source: ea722948146befb23c9529c1ec7f59fb2f34911f" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build/audit report: apps/android/build/local-ai-audit-report.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- Local AI status remains **Not Ready** until real ARM64 device inference, offline, RAM, and stability checks pass." >> "$GITHUB_STEP_SUMMARY"
          cat build/local-ai-audit-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source-native APK and audit evidence
        if: always() && github.event_name == 'workflow_dispatch' && steps.source_native_build.outcome == 'success' && hashFiles('apps/android/build/local-ai-audit-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-ai-arm64-native-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/android/build/app/outputs/flutter-apk/app-debug.apk
            apps/android/build/local-ai-audit-report.json
            apps/android/build/local-ai-toolchain.txt
            apps/android/pubspec.lock
          if-no-files-found: error
          retention-days: 14

      - name: Require both emulator cold-start checks to pass
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          API35_RESULT: ${{ steps.cold_api35.outcome }}
          API30_RESULT: ${{ steps.cold_api30.outcome }}
        run: |
          echo "API 35 cold-start: ${API35_RESULT}"
          echo "API 30 cold-start: ${API30_RESULT}"
          test "${API35_RESULT}" = success && test "${API30_RESULT}" = success
