name: Flutter quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install stable Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Generate Android Gradle scaffold
        working-directory: apps/android
        run: flutter create --platforms=android --project-name cybersecurity_assistant --org org.cybersecurityassistant .

      - name: Apply and test Android hardening configuration
        working-directory: apps/android
        run: |
          python3 -m unittest discover -s tool -p 'test_*.py' -v
          python3 tool/configure_android.py

      - name: Resolve Flutter dependencies
        working-directory: apps/android
        run: flutter pub get

      - name: Analyze Flutter source
        working-directory: apps/android
        run: flutter analyze

      - name: Run unit and widget tests
        working-directory: apps/android
        run: flutter test

      - name: Build Android debug APK
        working-directory: apps/android
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cybersecurity-assistant-android-verification
          path: |
            apps/android/build/app/outputs/flutter-apk/app-debug.apk
            apps/android/pubspec.lock
          if-no-files-found: error
          retention-days: 7
